name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test (모의 AI 모드, API 키 불필요)
        run: pytest -q
      - name: AI 품질 평가 (검색·가드레일)
        run: python eval/run_eval.py
