[project]
name = "sadari"
version = "0.1.0"
description = "사다리 — 청년을 위한 개인별 자산관리 AI 코치"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
# 이관 중 아직 없는 모듈도 외부 라이브러리가 아니라 프로젝트 코드로 분류한다
known-first-party = ["app", "tests"]
