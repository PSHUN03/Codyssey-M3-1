{# FE-05 icons stay local; the existing application icons and other pages are unchanged. #}
{% macro icon(name, size=20) -%}
<svg class="receipt-icon" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
  {% if name == "receipt-text" %}<path d="M4 3l2 1 2-1 2 1 2-1 2 1 2-1 2 1 2-1v18l-2-1-2 1-2-1-2 1-2-1-2 1-2-1-2 1zM8 8h8M8 12h8M8 16h5"/>
  {% elif name == "camera" %}<path d="M14 4h-4L8 7H4a2 2 0 0 0-2 2v10h20V9a2 2 0 0 0-2-2h-4z"/><circle cx="12" cy="13" r="4"/>
  {% elif name == "image-plus" %}<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1"/><path d="m3 17 5-5 4 4 3-3 6 6M16 5h6M19 2v6"/>
  {% elif name == "info" or name == "circle-alert" %}<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/>
  {% elif name == "sparkles" %}<path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5zM20 2v4M18 4h4"/>
  {% elif name == "scan-line" %}<path d="M3 7V3h4M17 3h4v4M21 17v4h-4M7 21H3v-4M3 12h18"/>
  {% elif name == "check" %}<path d="M4 12l5 5L20 6" pathLength="1"/>
  {% elif name == "pencil" %}<path d="m15 4 5 5M4 20l4-1L21 6l-4-4L4 15z"/>
  {% endif %}
</svg>
{%- endmacro %}
